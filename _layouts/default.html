<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-1BQWN7S13R"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-1BQWN7S13R');
    </script>

{% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    <!--[if lt IE 9]>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv.min.js"></script>
    <![endif]-->
    {% include head-custom.html %}
  </head>
  <body>
    <div class="wrapper">
      <header class="profile-header">
        <div class="profile-details">
          <h1><a href="{{ '/' | relative_url }}">Samuel Deng</a></h1>
          <p>samueldeng@nyu.edu</p>
          <p><a href="https://cds.nyu.edu/">Center for Data Science</a><br>
            <a href="https://www.nyu.edu/">New York University</a><br>
            CDS 205D, 60 5th Ave
          </p>
        </div>
        <img class="profile-photo" src="{{ '/assets/img/face.jpg' | relative_url }}" alt="Samuel Deng" width="200" height="244">
      </header>
      <nav class="page-nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>About</a>
        <span aria-hidden="true">|</span>
        <a href="{{ '/teaching/' | relative_url }}"{% if page.url == '/teaching/' %} aria-current="page"{% endif %}>Teaching</a>
        <span aria-hidden="true">|</span>
        <a href="{{ '/research/' | relative_url }}"{% if page.url == '/research/' %} aria-current="page"{% endif %}>Research</a>
      </nav>
      <main id="main-content" aria-label="{{ page.title | default: site.title }}">
        {{ content }}
      </main>
      <footer>
        {% if site.github.is_project_page %}
        <p>This project is maintained by <a href="{{ site.github.owner_url }}">{{ site.github.owner_name }}</a></p>
        {% endif %}
      </footer>
    </div>
  </body>
</html>
